<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kvizoo admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="base.css?v=5">
<link rel="stylesheet" href="pc.css?v=5">
<link rel="stylesheet" href="app.css?v=5">
<style>
  /* The app's own look (2026-11-18): app.css's "Midnight & Violet" tokens, Bricolage headings, Figtree text, white cards with a
     2px edge on the soft page colour, violet accent. Change colours in app.css, not here. */
  body{background:var(--bg); color:var(--text)}
  body:not(.focus){padding-left:0}
  .ad{max-width:1100px; margin:0 auto; padding:var(--s4) var(--gutter) var(--s7); --bar:var(--accent); --bar-on:var(--accent-ink)}
  .ad h1{display:flex; align-items:baseline; gap:8px; margin:var(--s3) 0; font:800 26px var(--head); letter-spacing:-.01em; color:var(--accent)}
  .ad h1 span{color:var(--muted); font-weight:700}
  .ad h2{font:800 20px var(--head); letter-spacing:-.01em; color:var(--text); margin:28px 0 12px}
  .ad-login{display:flex; flex-direction:column; gap:var(--s3); max-width:360px; margin-top:var(--s5)}
  .ad-login .btn-p{margin-top:var(--s1)}
  .ad-scroll{overflow-x:auto; background:var(--surface); border:2px solid var(--edge); border-radius:16px}
  .ad table{border-collapse:collapse; width:100%; font-size:14px; color:var(--text)}
  .ad th{font-weight:700; text-align:left; color:var(--muted); white-space:nowrap}
  .ad th,.ad td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top}
  .ad tr:last-child td{border-bottom:0}
  .ad td button{font:800 13px var(--head); padding:3px 10px; margin:0 var(--s1) var(--s1) 0; border:2px solid var(--edge); border-radius:999px; background:var(--surface); color:var(--accent-ink); cursor:pointer}
  @media (hover:hover){ .ad td button:hover{border-color:var(--accent)} }
  .ad-code{font-weight:800; letter-spacing:.1em; color:var(--text); user-select:all}
  .ad-err{color:var(--wrong); font-weight:700}
  .ad-muted{color:var(--muted)}
  .ad-note{margin:var(--s3) 0; padding:12px 16px; border-radius:16px; background:var(--accent-soft); font-weight:600; color:var(--text)}
  .ad-top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--s2) var(--s4)}
  .ad-tabs,.ad-seg{display:flex; flex-wrap:wrap; gap:6px}
  .ad-tabs button,.ad-seg button{font:800 14px var(--head); min-height:40px; padding:0 16px; border:2px solid var(--edge); border-radius:999px; background:var(--surface); color:var(--text); cursor:pointer; transition:transform .12s, background-color .2s, border-color .2s}
  .ad-tabs button:active,.ad-seg button:active{transform:scale(.97)}
  .ad-tabs button[aria-pressed=true],.ad-seg button[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
  @media (hover:hover){ .ad-tabs button:hover:not([aria-pressed=true]),.ad-seg button:hover:not([aria-pressed=true]){border-color:color-mix(in srgb, var(--accent) 45%, var(--edge))} }
  .ad-seg button:disabled{opacity:.6; cursor:wait}
  .ad-bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--s3); margin:var(--s3) 0 var(--s4)}
  .ad-check{display:flex; align-items:center; gap:var(--s2); font-size:14px; font-weight:600; color:var(--muted); cursor:pointer}
  .ad-check input{width:18px; height:18px; accent-color:var(--accent)}
  .ad-kpis{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
  @media (min-width:640px){ .ad-kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (min-width:1000px){ .ad-kpis{grid-template-columns:repeat(6,minmax(0,1fr))} }
  .ad-kpi,.ad-card{background:var(--surface); border:2px solid var(--edge); min-width:0}
  .ad-kpi{border-radius:18px; padding:14px 16px; box-shadow:0 3px 0 var(--edge)}
  .ad-kpi .l{font-size:14px; font-weight:700; color:var(--muted)}
  .ad-kpi .v{font:800 30px/1.2 var(--head); letter-spacing:-.01em; color:var(--text); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; margin-top:2px}
  .ad-kpi .s{font-size:13px; line-height:1.4; color:var(--muted); margin-top:4px}
  .ad-up{color:var(--good); font-weight:700} .ad-down{color:var(--wrong); font-weight:700}
  .ad-now{display:flex; flex-wrap:wrap; gap:var(--s2) var(--s5); margin:var(--s4) 0; padding:14px 18px; background:var(--accent-soft); border-radius:16px; font-size:14px; color:var(--text)}
  .ad-now b{font:800 16px var(--head); color:var(--text); font-variant-numeric:tabular-nums}
  .ad-card{margin-top:12px; border-radius:16px; padding:16px 18px}
  .ad-card h3{font:800 16px var(--head); color:var(--text); margin:0 0 14px}
  .ad-grid2,.ad-grid3{display:grid; gap:0 12px; grid-template-columns:1fr}
  @media (min-width:760px){ .ad-grid2{grid-template-columns:repeat(2,minmax(0,1fr))} .ad-grid3{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .ad-foot{font-size:13px; color:var(--muted); margin:var(--s2) 0 0}
  .ad code{font-size:13px; background:var(--fill); padding:1px 6px; border-radius:6px; color:var(--text); overflow-wrap:anywhere}
  /* Charts: one series per chart in the accent; text always in the text tokens. Bar chart = y labels | plot, x labels under it. */
  .ad-ch{display:grid; grid-template-columns:auto 1fr; column-gap:var(--s2)}
  .ad-y{position:relative; min-width:20px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .ad-y span{position:absolute; right:0; transform:translateY(50%); line-height:1}
  .ad-plot{position:relative; height:var(--h); border-bottom:1px solid var(--edge); touch-action:pan-y; cursor:crosshair}
  .ad-gl{position:absolute; left:0; right:0; border-top:1px solid var(--line)}
  .ad-cols{position:absolute; inset:0; display:flex; gap:2px}
  .ad-col{flex:1; min-width:0; display:flex; align-items:flex-end; justify-content:center}
  .ad-col i{display:block; width:100%; max-width:24px; min-height:2px; background:var(--bar); border-radius:4px 4px 0 0}
  .ad-col i.z{min-height:0}
  .ad-col.on i{background:var(--bar-on)}
  .ad-col.on{background:color-mix(in srgb, var(--accent) 10%, transparent); border-radius:4px 4px 0 0}
  .ad-x{grid-column:2; position:relative; height:20px; font-size:12px; color:var(--muted)}
  .ad-x span{position:absolute; top:4px; transform:translateX(-50%); white-space:nowrap}
  .ad-tip{position:absolute; top:-8px; z-index:5; pointer-events:none; background:var(--surface); color:var(--text); border:2px solid var(--edge); border-radius:12px; padding:8px 12px; font-size:13px; line-height:1.45; width:max-content; max-width:100%; box-shadow:0 8px 20px -6px color-mix(in srgb, var(--text) 30%, transparent); transform:translateY(-100%)}
  .ad-tip b{font-family:var(--head); color:var(--text)}
  .ad-tv summary{margin-top:var(--s2); font-size:13px; font-weight:700; color:var(--accent-ink); cursor:pointer}
  .ad-tv .ad-scroll{margin-top:var(--s2); max-height:280px; overflow-y:auto}
  /* horizontal bars: label | bar | number */
  .ad-h{display:grid; grid-template-columns:minmax(90px,max-content) 1fr auto; gap:10px 14px; align-items:center; font-size:14px; color:var(--text)}
  .ad-h .hb i{display:block; height:16px; min-width:2px; background:var(--bar); border-radius:0 6px 6px 0}
  .ad-h .hb i.z{min-width:0}
  .ad-h .hn{text-align:right; font:800 15px var(--head); color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap}
  .ad-h .hn .ad-muted{display:inline-block; min-width:4ch; margin-left:6px; font:600 13px var(--font)}
  .ad td.ad-n,.ad th.ad-n{text-align:right; font-variant-numeric:tabular-nums}
  .ad td.ad-sh{width:30%; min-width:60px}
  .ad td.ad-sh i{display:block; height:8px; min-width:2px; margin-top:8px; background:var(--bar); border-radius:0 4px 4px 0}
</style>
</head>
<body>
<div class="ad" id="ad"></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
