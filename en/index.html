<!-- kvizoo.com/en/: the link to send people abroad (2026-11-19). Instagram, WhatsApp and Messenger read the share card from the page
     before the #, and every /app/ link shows the Czech one. This page has the English card, then opens the app with the same # part
     (a tester link #/t/<code> keeps its code). No meta refresh: Meta's link crawler follows one and would show /app/'s Czech card. -->
<title>Exam prep from your slides · Kvizoo</title>
<meta name="description" content="Upload your lectures and get a course with levels, flashcards and quizzes right up to exam day. First lesson free.">

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/app/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kvizoo">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="https://kvizoo.com/en/">
<meta property="og:title" content="Exam prep from your slides · Kvizoo">

<script src="/app/hit.js"></script><!-- counts this visit with the site it came from, before the forward to the app drops it -->
<script>
// English unless the visitor already chose a language in the app (same key as web/js/util.js store: "pc." + name, JSON).
try { if (!localStorage.getItem("pc.lang")) localStorage.setItem("pc.lang", JSON.stringify("en")); } catch (e) { /* storage blocked: the app guesses */ }
location.replace("/app/" + location.search + location.hash);
</script>
</head>
